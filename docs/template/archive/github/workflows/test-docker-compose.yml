name: Supplemental Docker builds and Compose validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/jenkins-host/docker-compose.yml config --quiet
      - run: python3 ci/phase1.py backend-image
      - run: python3 ci/phase1.py frontend-image
      - run: python3 ci/phase1.py backend-image-smoke
      - run: python3 ci/phase1.py frontend-image-smoke
      - if: always()
        run: python3 ci/phase1.py cleanup
