name: Supplemental backend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ci/phase1.py backend-dependencies
      - run: python3 ci/phase1.py backend-lint
      - run: python3 ci/phase1.py backend-unit
      - run: python3 ci/phase1.py backend-integration
      - run: python3 ci/phase1.py backend-security
      - if: always()
        run: python3 ci/phase1.py cleanup
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-audit-reports
          path: .ci-output/
          if-no-files-found: ignore
