apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fastapi
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: dev
          - environment: stage
          - environment: prod
  template:
    metadata:
      name: 'app-{{environment}}'
    spec:
      project: fastapi
      source:
        repoURL: https://github.com/fastapi-traefik-devops/fastapi-traefik-datascientest-project.git
        targetRevision: main
        path: 'deploy/overlays/{{environment}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'app-{{environment}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - PruneLast=true
