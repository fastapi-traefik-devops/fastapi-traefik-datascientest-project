# kind DEV/STAGE monitoring: capacity and runtime validated with Jenkins offline.
# Apply this Git-backed source only after monitoring files are published to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: monitoring
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.2.0
    helm:
      releaseName: monitoring
      valueFiles:
      - $values/monitoring/values.yaml
  - repoURL: https://github.com/fastapi-traefik-devops/fastapi-traefik-liora-application.git
    targetRevision: main
    ref: values
  - repoURL: https://github.com/fastapi-traefik-devops/fastapi-traefik-liora-application.git
    targetRevision: main
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
      enabled: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
    - PruneLast=true
