title = "Phase 1: default rules with reviewed encrypted-value false positives"
[extend]
useDefault = true

# Ciphertext is not an API credential. Match both the exact SealedSecret path
# and the encrypted value syntax; plaintext stringData remains scanned.
[[allowlists]]
description = "Bitnami SealedSecret ciphertext, not plaintext credentials"
condition = "AND"
paths = ['''(?:k8s/overlays/dev/sealed-secret-(?:backend|db)\.yaml|infra/kind/secrets/app-(?:dev|stage)/(?:backend|db)-secrets\.yaml)$''']
regexTarget = "line"
regexes = ['''^\s+(?:SECRET_KEY|POSTGRES_PASSWORD|FIRST_SUPERUSER_PASSWORD):\s+Ag[A-Za-z0-9+/=]+\s*$''']

# Jenkins plugin versions such as timestamped releases resemble API keys to
# the generic rule. Restrict this exception to the lock file and its version
# syntax; every entry is also checked against the official update center.
# History scans pass each line with a leading newline, so allow surrounding
# whitespace; the whole line must still be one plugin coordinate.
[[allowlists]]
description = "Verified Jenkins plugin coordinates"
condition = "AND"
paths = ['''(?:^|/)infra/jenkins-host/plugins\.lock\.txt$''']
regexTarget = "line"
regexes = ['''^\s*[a-z][a-z0-9-]+:[0-9][0-9A-Za-z._-]*\s*$''']

# These API test artifacts use SHA-256 checksums to verify captured evidence.
# The generic-api-key heuristic incorrectly identifies some digest values as
# credentials. Exempt only JSON lines consisting entirely of a 64-digit hex
# checksum in the evidence files listed below; retain all other secret rules.
# The evidence validator independently checks these hashes against the files.
[[allowlists]]
description = "Verified SHA-256 digest fields in October 2026 API evidence"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)docs/backend-api-evidence-2026-10-24/evidence/(?:provenance|access-policy|results/(?:dev|stage|prod)-(?:private|public))\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(?:sha256|openapi_dev_sha256|openapi_response_sha256)":\s*"[a-f0-9]{64}"\s*,?\s*$''']
