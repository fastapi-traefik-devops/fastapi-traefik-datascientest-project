# Local kind HTTP only; standard STAGE overlay retains HTTPS/TLS.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-stage
  namespace: argocd
  annotations:
    argocd.argoproj.io/skip-reconcile: 'true'
spec:
  project: fastapi
  source:
    repoURL: https://github.com/fastapi-traefik-devops/fastapi-traefik-liora-application.git
    targetRevision: main
    path: deploy/overlays/stage
    kustomize:
      patches:
      - target:
          kind: Ingress
          name: app-ingress
        patch: "- op: remove\n  path: /spec/tls\n"
      - target:
          kind: ConfigMap
          name: backend-config
        patch: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: backend-config\n\
          data:\n  FRONTEND_HOST: http://stage.example.com\n  BACKEND_CORS_ORIGINS:\
          \ http://stage.example.com\n"
  destination:
    server: https://kubernetes.default.svc
    namespace: app-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - PruneLast=true
