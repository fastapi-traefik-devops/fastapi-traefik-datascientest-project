deployment:
  replicas: 1
service:
  type: ClusterIP
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    entryPoint: metrics
nodeSelector:
  ingress-ready: "true"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
# ClusterIP has no load balancer address; publish the actual local host endpoint.
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
# One node binds each host port once; replace without a surge pod.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
