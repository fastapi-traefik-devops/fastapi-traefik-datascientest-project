apiVersion: batch/v1
kind: Job
metadata:
  name: prestart
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      # Requires a pre-created "ghcr-pull-secret" (not managed by these
      # manifests) in the target namespace to pull private GHCR images.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: prestart
          image: backend:latest
          command: ["bash", "scripts/prestart.sh"]
          # Same backend-config/backend-secrets as the backend Deployment, so
          # migrations run against the same database/settings the app will use.
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
