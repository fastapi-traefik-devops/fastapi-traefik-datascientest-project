apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Requires a pre-created "ghcr-pull-secret" (not managed by these
      # manifests) in the target namespace to pull private GHCR images.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: backend:latest
          ports:
            - containerPort: 8000
          # backend-config/backend-secrets are also consumed by the prestart
          # Job so both run against the same environment before the app starts.
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          startupProbe:
            httpGet:
              path: /api/v1/utils/health-check/
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/utils/health-check/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/utils/health-check/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
