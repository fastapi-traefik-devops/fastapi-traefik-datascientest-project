# storageClassName is intentionally omitted so the PVC binds to whatever
# StorageClass the cluster marks as default (e.g. Minikube's "standard"),
# keeping this manifest portable across environments with different defaults.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-vol
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeMode: Filesystem
