name: Check generated API client

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: bash scripts/generate-client.sh
      - name: Verify committed generated client
        shell: bash
        run: |
          git diff --exit-code -- frontend/src/client/generated
          test -z "$(git ls-files --others --exclude-standard frontend/src/client/generated)"
