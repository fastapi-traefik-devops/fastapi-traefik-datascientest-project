name: Supplemental Playwright tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 ci/phase1.py backend-dependencies
      - run: python3 ci/phase1.py frontend-dependencies
      - run: python3 ci/phase1.py frontend-build
      - run: python3 ci/phase1.py frontend-tests
      - if: always()
        run: python3 ci/phase1.py cleanup
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          path: |
            .ci-output/frontend-tests.xml
            frontend/test-results/
          if-no-files-found: ignore
